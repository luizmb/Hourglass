name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    # Backstop against a hung test/tool holding a runner for the 6h default. Generous enough for a
    # cold Mint bootstrap (compiles the pinned tools from source) plus build, test, and periphery.
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}
          restore-keys: ${{ runner.os }}-mint-

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-homebrew-

      - name: Install Mint
        run: brew install mint

      - name: Install SwiftLint, SwiftFormat, Periphery
        run: mint bootstrap

      - name: Format (check)
        run: mint run swiftformat --lint .

      - name: Lint
        run: mint run swiftlint lint --strict

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test --no-parallel 2>&1

      - name: Periphery
        run: mint run periphery scan

  test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test --no-parallel 2>&1

  test-android:
    name: Build & Test (Android)
    runs-on: ubuntu-latest
    # Higher ceiling: provisions the Android SDK/toolchain and an emulator. Still far below the 6h
    # default so a deadlocked on-device run (which can't honour swift-testing's .timeLimit under the
    # XCTest pass) is killed promptly.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Cross-compiles with the Swift Android SDK and runs the suite on an emulator the action
      # provisions. The action caches the downloaded SDK/toolchain internally, so only the first
      # run pays the full download. Tests run in parallel: the action invokes the on-device binary
      # as both XCTest and swift-testing, and the XCTest pass rejects swift test's --no-parallel,
      # so serial execution can't be forced here. Timing tests use the deterministic TestClock.
      - name: Test Swift Package on Android
        uses: skiptools/swift-android-action@v2
        with:
          free-disk-space: true

  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Installs the Swift toolchain for Windows (uses the Visual Studio C++ tools preinstalled on
      # the runner). Toolchain setup must come before checkout/build.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE

      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test
