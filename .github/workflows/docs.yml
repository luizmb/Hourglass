name: Documentation

on:
  push:
    tags: ['v*']
  # Manual clean re-deploy (single artifact) without a new tag — transient Pages failures.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: Deploy Documentation
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Generate Documentation
        run: |
          swift package \
            --allow-writing-to-directory .docs \
            generate-documentation \
            --target Hourglass \
            --output-path .docs \
            --transform-for-static-hosting \
            --hosting-base-path Hourglass \
            --enable-experimental-overloaded-symbol-presentation

      - name: Redirect site root to the module's landing page
        run: |
          # DocC static hosting emits the module landing at /documentation/hourglass/, not
          # /documentation/. Point the root redirect straight at it so /Hourglass/ lands on content.
          cat > .docs/index.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=./documentation/hourglass/">
          <link rel="canonical" href="./documentation/hourglass/">
          <title>Hourglass — Documentation</title>
          <a href="./documentation/hourglass/">Redirecting to documentation…</a>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .docs

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
